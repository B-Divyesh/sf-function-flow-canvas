[package]
name = "function-flow-canvas"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A bounded, local call-path canvas powered by your installed language server"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-function-flow-canvas"
homepage = "https://function-flow-canvas.sociobot.in"
readme = "README.md"
keywords = ["lsp", "call-graph", "code-navigation", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "ffc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = "3"
